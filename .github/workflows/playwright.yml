name: Scheduled Playwright Tests

on:
  schedule:
    # Runs every day at 00:00 UTC (08:00 MYT)
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  playwright:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Write Job Summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const out = ["## Playwright Test Summary", ""];
            if (fs.existsSync("test-results/results.json")) {
              const data = JSON.parse(fs.readFileSync("test-results/results.json", "utf8"));
              const stats = data.stats || {};
              out.push(`- **Expected (Passed):** ${stats.expected ?? 0}`);
              out.push(`- **Unexpected (Failed):** ${stats.unexpected ?? 0}`);
              out.push(`- **Flaky:** ${stats.flaky ?? 0}`);
              out.push(`- **Skipped:** ${stats.skipped ?? 0}`);
              out.push("");
              out.push("| Suite / Test | Status |");
              out.push("| --- | --- |");
              const walk = (suites, prefix = "") => {
                for (const s of suites || []) {
                  const name = prefix ? `${prefix} › ${s.title}` : s.title;
                  for (const spec of s.specs || []) {
                    const status = spec.ok ? "✅ Passed" : "❌ Failed";
                    out.push(`| ${name ? name + " › " : ""}${spec.title} | ${status} |`);
                  }
                  walk(s.suites, name);
                }
              };
              walk(data.suites);
            } else {
              out.push("No JSON results file found.");
            }
            out.push("");
            out.push("Download the **playwright-report** artifact below for the zipped HTML report, or view it live on GitHub Pages.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Upload Playwright report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
